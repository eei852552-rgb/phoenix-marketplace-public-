<!doctype html>
<html lang="my">
<head>

  <meta name="theme-color" content="#101a32">
  <title>စာမျက်နှာ မတွေ့ပါ — Phoenix Marketplace Club</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif}.panel{width:min(100%,520px);padding:36px 24px;text-align:center;background:#fff;border:1px solid #e6eaf1;border-radius:20px;box-shadow:0 16px 45px #14213a10}.logo{margin:auto;width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#ffe08a,#e99a24);font-size:30px;font-weight:900;color:#15213a}.code{margin:22px 0 0;color:#d18b19;font-size:13px;font-weight:900;letter-spacing:3px}h1{font-size:25px;line-height:1.5}p{color:#697586;line-height:1.8;font-size:14px}a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:#101a32;color:#fff;text-decoration:none;font-weight:800}

<body>
  <main class="panel">
    <div class="logo">P</div>
    <div class="code">ERROR 404</div>
    <h1>ဒီစာမျက်နှာကို ရှာမတွေ့ပါ</h1>
    <p>လင့်ခ်မှားနေနိုင်သလို စာမျက်နှာကိုလည်း ရွှေ့ထားနိုင်ပါတယ်။ ပင်မဈေးကွက်စာမျက်နှာကို ပြန်သွားနိုင်ပါတယ်။</p>
    <a href="./">ပင်မစာမျက်နှာသို့ ပြန်သွားရန်</a>
  </main>
</body>
</html>
