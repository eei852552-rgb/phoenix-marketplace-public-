name: Backend API checks
on:
  push:
    branches: ["feature/backend-foundation"]
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
